<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded card -->
  <rect width="100" height="100" rx="26" fill="#090d16" />
  <rect width="94" height="94" x="3" y="3" rx="23" fill="none" stroke="url(#neonGrad)" stroke-width="2" stroke-opacity="0.7" />
  
  <!-- Snake Neon Glow Aura -->
  <path d="M22 75 C 22 55, 45 62, 50 48 C 55 34, 38 28, 56 22 C 72 16, 80 32, 74 46 C 68 60, 52 64, 48 78" 
        fill="none" 
        stroke="#00ff88" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.35"
        filter="url(#neonGlow)" />
  
  <!-- Snake Body -->
  <path d="M22 75 C 22 55, 45 62, 50 48 C 55 34, 38 28, 56 22 C 72 16, 80 32, 74 46 C 68 60, 52 64, 48 78" 
        fill="none" 
        stroke="url(#neonGrad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Glowing Food Orbs in background -->
  <circle cx="28" cy="30" r="3" fill="#ff0055" filter="url(#neonGlow)" />
  <circle cx="78" cy="68" r="3.5" fill="#ffe600" filter="url(#neonGlow)" />

  <!-- Snake Head -->
  <circle cx="75" cy="27" r="10.5" fill="#00f5ff" filter="url(#neonGlow)" />
  <circle cx="75" cy="27" r="8.5" fill="#051923" stroke="#00f5ff" stroke-width="2" />
  
  <!-- Snake Eyes (Glowing) -->
  <circle cx="72" cy="24" r="2.2" fill="#ffffff" />
  <circle cx="78" cy="27" r="2.2" fill="#ffffff" />
  <circle cx="72" cy="24" r="1.1" fill="#00ff88" />
  <circle cx="78" cy="27" r="1.1" fill="#00ff88" />
</svg>
